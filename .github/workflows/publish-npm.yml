name: Publish to npm

# Auth via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Requires: package Trusted Publisher on npmjs.com → GitHub Actions
#   org/user: AjdinHusic, repo: setly, workflow: publish-npm.yml
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional git tag to publish (e.g. v0.1.0). Must point at a commit on main. Leave empty to publish the current main HEAD."
        required: false
        type: string

permissions:
  contents: read
  id-token: write # Required for OIDC → npm Trusted Publishing

jobs:
  publish:
    # Releases: only when the release targets main.
    # Manual runs: only when dispatched from the main branch.
    if: >
      (github.event_name == 'release' && github.event.release.target_commitish == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Verify commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing to publish: checked-out commit is not on origin/main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs Node ≥ 22.14 and npm ≥ 11.5.1
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Show toolchain
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Do not set NODE_AUTH_TOKEN — that forces legacy token auth and breaks OIDC.
      - name: Publish to npm
        run: npm publish --access public
