name: Publish to npm

# Auth via npm Trusted Publishing (OIDC) — no NPM_TOKEN / NODE_AUTH_TOKEN.
# On npmjs.com package settings → Trusted Publisher:
#   GitHub Actions · AjdinHusic / setly · workflow: publish-npm.yml
#   (leave Environment empty unless this job sets `environment:`)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional git tag to publish (e.g. v0.1.0). Must point at a commit on main. Leave empty to publish the current main HEAD."
        required: false
        type: string

permissions:
  contents: read
  id-token: write # Required for OIDC → npm Trusted Publishing

jobs:
  publish:
    # Releases: only when the release targets main.
    # Manual runs: only when dispatched from the main branch.
    if: >
      (github.event_name == 'release' && github.event.release.target_commitish == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Verify commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing to publish: checked-out commit is not on origin/main"
            exit 1
          fi

      # Do NOT set registry-url here. setup-node would write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} (and a placeholder
      # NODE_AUTH_TOKEN), which blocks OIDC and causes ENEEDAUTH.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Show toolchain
        run: |
          node -v
          npm -v
          echo "NODE_AUTH_TOKEN set? ${NODE_AUTH_TOKEN:+yes}"
          echo "OIDC request URL set? ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
